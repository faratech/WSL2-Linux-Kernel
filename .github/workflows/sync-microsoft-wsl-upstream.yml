name: Sync Microsoft WSL upstream refs

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-microsoft-wsl-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine latest Microsoft WSL release
        id: release
        run: |
          set -euo pipefail
          tag="$(curl -fsSL 'https://api.github.com/repos/microsoft/WSL2-Linux-Kernel/releases?per_page=1' | jq -r '.[0].tag_name')"
          test -n "$tag"
          version="${tag#linux-msft-wsl-}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          branch="linux-msft-wsl-${major}.${minor}.y"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch upstream refs
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/microsoft/WSL2-Linux-Kernel.git
          git fetch --depth=1 upstream \
            refs/heads/${{ steps.release.outputs.branch }}:refs/remotes/upstream/${{ steps.release.outputs.branch }}
          git fetch --depth=1 upstream \
            refs/tags/${{ steps.release.outputs.tag }}:refs/tags/${{ steps.release.outputs.tag }}

      - name: Push mirror refs to fork
        run: |
          set -euo pipefail
          git push --force-with-lease origin \
            refs/remotes/upstream/${{ steps.release.outputs.branch }}:refs/heads/upstream/${{ steps.release.outputs.branch }}
          git push --force-with-lease origin \
            refs/tags/${{ steps.release.outputs.tag }}:refs/heads/upstream/latest-release
          git push origin \
            refs/tags/${{ steps.release.outputs.tag }}:refs/tags/${{ steps.release.outputs.tag }}
